name: CI

# On every push and pull request: luacheck over the whole addon, and the offline tests
# (Tests/run.lua if there is one, else every Tests/*_test.lua). Releases are a separate workflow (release.yml).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: |
          # only the files in the repository (not the tools the runner installs in the workspace)
          git ls-files "*.lua" | xargs luacheck --no-color --codes > luacheck.txt || {
            cat luacheck.txt
            # also as annotations, so they show on the commit and in pull requests
            grep -E "^ +[^ ].*:[0-9]+:[0-9]+:" luacheck.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Tests
        run: |
          fail() {
            cat tests.txt
            # the failing lines also as annotations, so they show on the commit and in pull requests
            grep -E "FAIL|lua:|error|Error" tests.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          if [ -f Tests/run.lua ]; then
            lua Tests/run.lua > tests.txt 2>&1 || fail
            tail -1 tests.txt
          else
            for t in Tests/*_test.lua; do
              [ -e "$t" ] || continue
              echo "== $t"
              lua "$t" > tests.txt 2>&1 || fail
              tail -1 tests.txt
            done
          fi
